<!doctype html>
<html lang="nl">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Forum API – Documentatie</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css">
   <style>
      body { margin: 0; }
   </style>
</head>
<body>
   <div id="swagger-ui"></div>

   <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
   <script>
      // De specificatie staat in de root van het project: ../openapi.yaml
      SwaggerUIBundle({
         url: '../openapi.yaml',
         dom_id: '#swagger-ui',
         deepLinking: true,
         defaultModelsExpandDepth: 0,
         docExpansion: 'list',
      });
   </script>
</body>
</html>
